<!DOCTYPE html>
<html lang="vi" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý gym Pokémon Masters EX: thành viên, pair, Pasio Tower, log Gym Battle.">
  <title>PMEX Gym Manager</title>
  <link rel="icon" href="../assets/items/master-ball.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="gym.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('pmex-theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'pokedex' : 'night');
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">
      <img src="../assets/items/master-ball.png" alt="" class="px-img logo-ball">
      <span class="logo-text">GYM<span class="logo-sub">MANAGER <b id="mode-tag" class="mode-tag"></b></span></span>
    </a>
    <nav class="nav hidden" id="nav">
      <a href="#/" data-route="home"><img src="../assets/items/star-piece.png" alt="" class="px-img">Tổng quan</a>
      <a href="#/log" data-route="log"><img src="../assets/items/rare-candy.png" alt="" class="px-img">Ghi lượt</a>
      <a href="#/plan" data-route="plan"><img src="../assets/items/ultra-ball.png" alt="" class="px-img">Kế hoạch</a>
      <a href="#/members" data-route="members"><img src="../assets/items/exp-share.png" alt="" class="px-img">Thành viên</a>
      <a href="#/admin" data-route="admin" id="nav-admin" class="hidden"><img src="../assets/items/master-ball.png" alt="" class="px-img">Quản trị</a>
      <a href="#/account" data-route="account">Tài khoản</a>
    </nav>
    <div class="top-right">
      <span id="userbox"></span>
      <a class="chip sm" href="../" title="Mở PMEX Dex">📖 Dex</a>
      <div class="theme-picker" id="theme-picker" role="radiogroup" aria-label="Theme"></div>
    </div>
  </header>

  <main id="view" class="view">
    <div class="loading"><img src="../assets/items/poke-ball.png" alt="" class="px-img spin"> Loading…</div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Pair catalog, sprites and Gym Battles come from the Dex build -->
  <script src="../data/data.js"></script>
  <script src="config.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
