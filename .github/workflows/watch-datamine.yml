name: Watch datamine for two hours

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-datamine
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check each minute and request guarded updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WATCH_MINUTES: 120
          WATCH_INTERVAL_SECONDS: 60
        run: node scripts/watch-datamine.mjs
