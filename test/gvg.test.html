<!doctype html><meta charset="utf-8"><main id="view"></main><nav id="nav"></nav><div id="tooltip"></div><div id="theme-picker"></div><span id="footer-info"></span>
<pre id="out">pending</pre>
<!-- Serve the repo root (python -m http.server 8765) and open /test/gvg.test.html — every line must read PASS -->
<script src="../site/data/data.js"></script><script src="../site/app.js"></script><script src="../site/gvg.js"></script>
<script>
addEventListener('DOMContentLoaded', () => setTimeout(async () => {
  const res = []; const ok = (name, cond, info = '') => res.push(`${cond ? 'PASS' : 'FAIL'} ${name}${cond ? '' : ' :: ' + JSON.stringify(info)}`);
  try {
    const g = D.gyms.at(-1);
    const s = { id: 'S', guild: 'T', gym: g.name, tickets: { day1: 12, daily: 3, days: 6 }, members: [
      { id: 'a', name: 'A' }, { id: 'b', name: 'B' }, { id: 'c', name: 'C', banned: true }], entries: [], profiles: {}, gone: [] };
    const start = Date.parse(g.phases.find(p => p.name === 'Battle').start + 'Z');
    let ctx = gvgCtx(s, start + 2.5 * DAY_MS);
    ok('8 maps from leaders', ctx.maps.length === 8, ctx.maps);
    ok('round 1 active, cap 10000', ctx.active === 1 && ctx.round(1).max === 10000, [ctx.active, ctx.round(1)]);
    ok('tickets day 3 = 12 + 3×2', ctx.granted === 18, ctx.granted);
    ok('no tickets before start', gvgCtx(s, start - 1).granted === 0);
    ok('tickets cap after regen days', gvgCtx(s, start + 30 * DAY_MS).granted === 12 + 18);
    const team = [{ id: PAIRS[0].id, name: 'x', ml: 1, lv: null, ex: 'none' }];
    const base = { m: 'a', map: ctx.maps[0], t: 3, p: 5000, r: 1, team };
    ok('valid entry', gvgValidate(s, ctx, base) === null, gvgValidate(s, ctx, base));
    ok('tickets 4 rejected', !!gvgValidate(s, ctx, { ...base, t: 4 }));
    ok('over cap rejected', /còn thiếu 10.000/.test(gvgValidate(s, ctx, { ...base, p: 10001 }) || ''), gvgValidate(s, ctx, { ...base, p: 10001 }));
    ok('banned rejected', /khoá/.test(gvgValidate(s, ctx, { ...base, m: 'c' }) || ''));
    ok('wrong round rejected', /round đang mở/.test(gvgValidate(s, ctx, { ...base, r: 2 }) || ''));
    ok('team required', /ít nhất 1/.test(gvgValidate(s, ctx, { ...base, team: [] }) || ''));
    ok('dup pair rejected', /trùng/.test(gvgValidate(s, ctx, { ...base, team: [team[0], team[0]] }) || ''));
    const noEx = PAIRS.find(p => !p.exRole);
    ok('EXR needs EX role', /EX Role/.test(gvgValidate(s, ctx, { ...base, team: [{ id: noEx.id, name: 'n', ml: 1, ex: 'exr' }] }) || ''));
    const noSA = PAIRS.find(p => !p.dates?.Superawakened);
    ok('move lv >5 needs SA', /Move Level/.test(gvgValidate(s, ctx, { ...base, team: [{ id: noSA.id, name: 'n', ml: 6, ex: 'none' }] }) || ''));
    // Fill round 1 on every map (split over members so tickets suffice)
    let i = 0; const add = (r, map, p, m = 'a', t = 1) => s.entries.push({ id: 'e' + (++i), at: i, m, r, map, t, p, team });
    ctx.maps.forEach((map, k) => add(1, map, 10000, k % 2 ? 'a' : 'b'));
    ctx = gvgCtx(s, start + 2.5 * DAY_MS);
    ok('round 1 cleared → round 2 active', ctx.status[1] === 'completed' && ctx.active === 2, ctx.status);
    ok('tickets left per member', gvgTicketsLeft(ctx, 'a') === 18 - 4, gvgTicketsLeft(ctx, 'a'));
    // Banned points excluded from combined score but still count for progress
    add(2, ctx.maps[0], 1234, 'c');
    ctx = gvgCtx(s, start + 2.5 * DAY_MS);
    ok('combined excludes banned', ctx.combined === 80000, ctx.combined);
    ok('progress keeps banned points', ctx.pts[2][ctx.maps[0]] === 1234);
    // Delete one round-1 entry → round 1 reopens, round 2 no longer active
    s.entries = s.entries.filter(e => e.id !== 'e1');
    ctx = gvgCtx(s, start + 2.5 * DAY_MS);
    ok('delete reopens round 1', ctx.active === 1 && !ctx.status[2], ctx.status);
    // Edit an entry: its own points are excluded when checking the cap
    const e2 = s.entries.find(e => e.id === 'e2');
    ok('edit within cap ok', gvgValidate(s, ctx, { ...base, m: e2.m, map: e2.map, r: 1, p: 10000, t: 3 }, e2) === null, gvgValidate(s, ctx, { ...base, m: e2.m, map: e2.map, r: 1, p: 10000, t: 3 }, e2));
    // Ticket rules: regular circuits cost 3, Extra Battles 1–3; default schedule 9 + 3/day until Battle ends
    ok('regular circuit fixed at 3 tickets', /luôn tốn 3 vé/.test(gvgValidate(s, ctx, { ...base, t: 1 }) || ''), gvgValidate(s, ctx, { ...base, t: 1 }));
    const exN = g.circuits.findIndex(c => !/Regular/i.test(c.kind)) + 1;
    ok('extra battle allows 1 ticket', ctx.round(exN).fixed === null && ctx.round(3).fixed === 3, [ctx.round(3), ctx.round(exN)]);
    const auto = { ...s, tickets: undefined };
    const days = Math.round((Date.parse(g.phases.find(p => p.name === 'Battle').end + 'Z') - start) / DAY_MS) - 1;
    ok('per-member cap 30', gvgCtx({ ...s, tickets: { day1: 9, daily: 3, days: 20 } }, start + 99 * DAY_MS).granted === 30);
    const gymFull = { ...s, tickets: { day1: 9, daily: 3, days: 6, gymCap: 10 } };
    ok('gym cap 600 (here 10) blocks', /cả Gym|Cả Gym/.test(gvgValidate(gymFull, gvgCtx(gymFull, start + 2.5 * DAY_MS), { ...base, r: gvgCtx(gymFull, start + 2.5 * DAY_MS).active }) || ''),
      gvgValidate(gymFull, gvgCtx(gymFull, start + 2.5 * DAY_MS), { ...base, r: gvgCtx(gymFull, start + 2.5 * DAY_MS).active }));
    ok('default tickets 9 + 3/day to end', gvgCtx(auto, start + 1).granted === 9 && gvgCtx(auto, start + 99 * DAY_MS).granted === 9 + 3 * days, [gvgCtx(auto, start + 1).granted, days]);
    // Repeat rounds + rule rotation
    const C = g.circuits.length;
    ok('last circuit label', ctx.round(C).label === 'Extra Battle 12', ctx.round(C));
    ok('repeat round', ctx.round(C + 1).label === 'Extra Battle 13' && ctx.round(C + 1).max === g.circuits.at(-1).pts && ctx.round(C + 1).repeat, ctx.round(C + 1));
    const L = g.stages.at(-1).leaders[0];
    ok('rules rotate 1/2/3', [C, C + 1, C + 2, C + 3].map(n => ctx.leaderAt(n, L.name).ruleText).join('|') === [L.rules[0], L.rules[1], L.rules[2], L.rules[0]].join('|'),
      [C, C + 1, C + 2, C + 3].map(n => ctx.leaderAt(n, L.name).ruleText));
    ok('early round rule = theme', ctx.leaderAt(1, L.name).ruleText === (g.stages[0].leaders[0].theme || 'No rules'));
    // Share round trip
    const code = await gvgPack(s);
    const back = await gvgUnpack(code);
    ok('share pack/unpack', JSON.stringify(back.seasons[0]) === JSON.stringify(s) && !/[\/+=]/.test(code), code.length);
    // Merge: newer edit wins, tombstone removes, new entry arrives
    const A = { v: 1, active: 'S', seasons: [JSON.parse(JSON.stringify({ ...s, u: 1 }))] };
    const B = JSON.parse(JSON.stringify(A));
    B.seasons[0].entries.find(e => e.id === 'e3').p = 999; B.seasons[0].entries.find(e => e.id === 'e3').u = 50;
    B.seasons[0].entries = B.seasons[0].entries.filter(e => e.id !== 'e4'); B.seasons[0].gone.push('e4');
    B.seasons[0].entries.push({ id: 'new', at: 99, m: 'b', r: 1, map: ctx.maps[0], t: 1, p: 1, team, u: 60 });
    gvgMerge(A, B);
    const M = A.seasons[0].entries;
    ok('merge newer wins', M.find(e => e.id === 'e3').p === 999);
    ok('merge tombstone', !M.some(e => e.id === 'e4'));
    ok('merge adds new', M.some(e => e.id === 'new'));
    ok('valid store check', gvgValidStore(A) && !gvgValidStore({ v: 1, seasons: [{}] }));
  } catch (err) { res.push('ERROR ' + err.stack); }
  document.getElementById('out').textContent = res.join('\n');
}, 50));
</script>
