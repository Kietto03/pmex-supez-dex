<!doctype html><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0;width:1300px;height:1400px}</style>
<pre id="out">pending</pre>
<!-- End-to-end: serve the repo root (python -m http.server 8765), open /test/gvg.e2e.html — overwrites this origin’s GvG data -->
<script src="../site/data/data.js"></script>
<script>
const D = window.PMEX_DATA, g = D.gyms[0];
localStorage.setItem('pmex-gvg', JSON.stringify({ v: 1, active: 'S', seasons: [{ id: 'S', guild: 'E2E', gym: g.name, tickets: { day1: 12, daily: 3, days: 6 },
  members: [{ id: 'm1', name: 'Alice' }, { id: 'm2', name: 'Bob' }], entries: [], profiles: {}, gone: [] }] }));
const f = document.createElement('iframe'); f.src = '../site/index.html#/gvg/log'; document.body.appendChild(f);
const wait = ms => new Promise(r => setTimeout(r, ms));
const log = []; const ok = (n, c, i = '') => log.push(`${c ? 'PASS' : 'FAIL'} ${n}${c ? '' : ' :: ' + i}`);
f.onload = async () => {
  try {
    await wait(800);
    const d = f.contentDocument, w = f.contentWindow;
    const q = s => d.querySelector(s);
    const sel = q('[data-g-field="m"]'); sel.value = 'm1'; sel.dispatchEvent(new Event('change', { bubbles: true })); await wait(50);
    q('[data-g="map"]').click(); await wait(50);
    q('[data-g="t"][data-v="2"]').click(); await wait(50);
    const p = q('[data-g-field="p"]'); p.value = '4000'; p.dispatchEvent(new Event('input', { bubbles: true }));
    const s1 = q('#gvg-pair-q'); s1.value = 'lysandre'; s1.dispatchEvent(new Event('input', { bubbles: true })); await wait(50);
    ok('pair search finds results', d.querySelectorAll('#gvg-results [data-g="addpair"]').length > 0);
    q('#gvg-results [data-g="addpair"]').click(); await wait(50);
    ok('pair slot added', d.querySelectorAll('.gvg-slot').length === 1);
    const ml = q('[data-g-slot="0"][data-k="ml"]'); ml.value = '5'; ml.dispatchEvent(new Event('change', { bubbles: true }));
    q('form[data-g-form="entry"]').requestSubmit(); await wait(100);
    let st = JSON.parse(localStorage.getItem('pmex-gvg')).seasons[0];
    ok('entry saved', st.entries.length === 1 && st.entries[0].p === 4000 && st.entries[0].t === 2 && st.entries[0].team[0].ml === 5, JSON.stringify(st.entries));
    ok('profile remembered', st.profiles.m1 && Object.values(st.profiles.m1)[0].ml === 5);
    ok('member kept for next entry', q('[data-g-field="m"]').value === 'm1');
    // Invalid: over the cap
    q('[data-g="map"]').click(); await wait(50);
    const p2 = q('[data-g-field="p"]'); p2.value = '999999'; p2.dispatchEvent(new Event('input', { bubbles: true }));
    q('form[data-g-form="entry"]').requestSubmit(); await wait(100);
    ok('cap error shown', /Vượt trần/.test(q('#gvg-err').textContent), q('#gvg-err').textContent);
    // Edit from history, then delete
    w.location.hash = '#/gvg/history'; await wait(150);
    q('[data-g="edit"]').click(); await wait(150);
    const p3 = q('[data-g-field="p"]'); p3.value = '6000'; p3.dispatchEvent(new Event('input', { bubbles: true }));
    q('form[data-g-form="entry"]').requestSubmit(); await wait(150);
    st = JSON.parse(localStorage.getItem('pmex-gvg')).seasons[0];
    ok('edit saved', st.entries[0].p === 6000, st.entries[0].p);
    w.confirm = () => true;
    w.location.hash = '#/gvg/history'; await wait(150);
    q('[data-g="del"]').click(); await wait(100);
    st = JSON.parse(localStorage.getItem('pmex-gvg')).seasons[0];
    ok('delete + tombstone', st.entries.length === 0 && st.gone.length === 1);
    // Members: add, ban
    w.location.hash = '#/gvg/members'; await wait(150);
    q('form[data-g-form="members"] textarea').value = 'Carol\nalice\n'; q('form[data-g-form="members"]').requestSubmit(); await wait(100);
    st = JSON.parse(localStorage.getItem('pmex-gvg')).seasons[0];
    ok('add member (dedupe case-insensitive)', st.members.length === 3, st.members.map(m => m.name));
    q('[data-g="ban"]').click(); await wait(100);
    ok('ban toggles', JSON.parse(localStorage.getItem('pmex-gvg')).seasons[0].members[0].banned === true);
    // Share link → read-only view
    w.location.hash = '#/gvg/data'; await wait(150);
    q('[data-g="share"]').click(); await wait(500);
    const url = q('#gvg-share').value;
    ok('share link built', /#\/gvg\/v~[A-Za-z0-9_-]+$/.test(url), url.slice(0, 80));
    w.location.hash = url.split('#')[1]; await wait(800);
    ok('read-only view', !!q('.gvg-ro') && !q('[data-g-form="entry"]') && d.querySelectorAll('.gvg-tabs .chip').length === 2);
  } catch (e) { log.push('ERROR ' + e.stack); }
  document.getElementById('out').textContent = log.join('\n');
};
</script>
